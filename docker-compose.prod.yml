version: '3.9'

services:
  nginx:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [public]
    ports:
      - "80:80"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
    networks: [internal, public]
    depends_on:
      postgres: { condition: service_healthy }
      ollama:   { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512m

  postgres:
    deploy:
      resources:
        limits:
          memory: 1g

  ollama:
    deploy:
      resources:
        limits:
          memory: 8g
