server {
  listen ${PORT};
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 8.8.8.8 valid=30s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /health {
    return 200 'ok';
    add_header Content-Type text/plain;
  }

  # Reverse-proxy /api/* to the backend service.
  # ${API_URL} is substituted at container start by nginx envsubst
  # (set API_URL=https://your-api.railway.app in the frontend service env vars).
  # Using a variable in proxy_pass forces DNS resolution per-request (required for HTTPS upstreams).
  location /api/ {
    set $upstream ${API_URL};
    proxy_pass $upstream;
    proxy_ssl_server_name on;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
  }

  location ~* \.(js|css|png|svg|ico|woff2)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
